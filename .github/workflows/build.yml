name: 构建陌辞 APK

on:
  workflow_dispatch:

jobs:
  build:
    name: 编译陌辞
    runs-on: ubuntu-latest

    steps:
      - name: 下载项目源码
        uses: actions/checkout@v4

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 生成gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x ./gradlew

      - name: 检查项目结构
        run: |
          echo "===== 当前目录 ====="
          pwd
          echo "===== 文件 ====="
          ls -la
          echo "===== app目录 ====="
          ls -la app

      - name: 构建Debug APK
        run: |
          ./gradlew clean assembleDebug --stacktrace

      - name: 查找APK
        run: |
          echo "===== 查找APK ====="
          find . -type f -name "*.apk" -print

      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: MoCi‑APK
          path: app/build/outputs/apk/debug/app-debug.apk
